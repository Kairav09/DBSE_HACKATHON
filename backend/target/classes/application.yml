spring:
  application:
    name: smart-parking-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/smart_parking?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:smart-parking-dev-secret-key-change-me-in-production-0123456789abcdef}
    expiration-ms: 86400000

prediction:
  service:
    url: ${PREDICTION_SERVICE_URL:http://localhost:8000}
